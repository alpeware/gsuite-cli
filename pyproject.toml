[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gsuite-cli"
version = "0.1.0"
description = "Lightweight multi-account CLI and Antigravity progressive skill for Google Workspace and Gmail"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Alpeware", email = "info@alpeware.com" }
]
dependencies = [
    "google-api-python-client>=2.140.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth>=2.34.0",
    "click>=8.1.7",
    "rich>=13.8.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0"
]

[project.scripts]
gsuite = "gsuite_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gsuite_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
